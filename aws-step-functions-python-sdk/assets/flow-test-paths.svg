<svg viewBox="0 0 900 884" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, ui-monospace, SF Mono, Menlo, monospace">
  <!-- Standalone version of the dashboard's section-04 live execution graph,
       repeated once per test mode with the taken path highlighted.
       Palette and node geometry match dashboard/index.html exactly. -->
  <rect x="0" y="0" width="900" height="884" fill="#FFFFFF"/>

  <defs>
    <marker id="aOk" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#1C7A55"/></marker>
    <marker id="aCrit" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#AC3128"/></marker>
    <marker id="aWarn" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#A96A12"/></marker>

    <!-- one reusable graph skeleton: untaken edges + node frames are drawn
         per-panel so each panel can restyle them -->
    <style>
      .hdr      { font-size: 12px; font-weight: 600; letter-spacing: .14em; fill: #0E5B69; }
      .hdrnote  { font-size: 10.5px; fill: #6B7C84; }
      .ntext    { font-size: 11px; fill: #101A1E; text-anchor: middle; }
      .nsub     { font-size: 9px;  fill: #3D4C53; text-anchor: middle; }
      .mut text { fill: #6B7C84; }
      .edge     { stroke: #D6DEE1; stroke-width: 1.8; fill: none; }
      .elabel   { font-size: 9.5px; }
      .cap      { font-size: 10px; fill: #6B7C84; }
      /* node status fills, matching the dashboard's g-* classes */
      .n-idle rect      { fill: #EDF1F2; stroke: #D6DEE1; stroke-width: 2; }
      .n-skip rect      { fill: #EDF1F2; stroke: #D6DEE1; stroke-width: 2; stroke-dasharray: 4 4; opacity: .55; }
      .n-skip text      { opacity: .55; }
      .n-ok rect        { fill: #CFE7DC; stroke: #1C7A55; stroke-width: 2; }
      .n-fail rect      { fill: #F3D8D5; stroke: #AC3128; stroke-width: 2; }
      .n-timeout rect   { fill: #F2E3C8; stroke: #AC3128; stroke-width: 2; stroke-dasharray: 5 3; }
      .n-warn rect      { fill: #F2E3C8; stroke: #A96A12; stroke-width: 2; }
    </style>
  </defs>

  <!-- title band -->
  <text x="24" y="34" font-size="15" font-weight="600" fill="#101A1E">One state machine, three test modes — the path each one takes</text>
  <text x="24" y="52" class="cap">test-mode dropdown in the dashboard · same graph the AWS console's execution view draws</text>

  <!-- ============ PANEL 1 · NORMAL RUN ============ -->
  <g transform="translate(0,72)">
    <text x="24" y="16" class="hdr">01 · NORMAL RUN</text>
    <text x="250" y="16" class="hdrnote">success callback wakes the paused state instantly — the fallback lanes never run</text>
    <g transform="translate(0,26)">
      <!-- untaken edges -->
      <path class="edge" d="M260,95 L260,138"/>
      <path class="edge" d="M390,165 L433,165"/>
      <path class="edge" d="M610,150 C 665,138 695,105 735,82"/>
      <path class="edge" d="M610,178 L735,178"/>
      <path class="edge" d="M430,88 C 555,102 645,122 735,152"/>
      <!-- taken path -->
      <path d="M150,65 L193,65" stroke="#1C7A55" stroke-width="2.6" fill="none" marker-end="url(#aOk)"/>
      <path d="M430,55 L731,55" stroke="#1C7A55" stroke-width="2.6" fill="none" marker-end="url(#aOk)"/>
      <text x="470" y="46" class="elabel" fill="#1C7A55" font-weight="600">success callback · {"building_count": 1080}</text>
      <!-- nodes -->
      <g class="n-ok"><rect x="20" y="40" width="130" height="50" rx="3"/><text class="ntext" x="85" y="69">PreviousStep</text></g>
      <g class="n-ok"><rect x="200" y="35" width="230" height="60" rx="3"/>
        <text class="ntext" x="315" y="60">SubmitAndAwaitCallback</text>
        <text class="nsub" x="315" y="78">waitForTaskToken · woken by the job</text></g>
      <g class="n-skip"><rect x="200" y="140" width="190" height="50" rx="3"/><text class="ntext" x="295" y="169">FindRun</text></g>
      <g class="n-skip"><rect x="435" y="140" width="175" height="50" rx="3"/><text class="ntext" x="522" y="169">PollUntilComplete</text></g>
      <g class="n-ok"><rect x="740" y="40" width="140" height="50" rx="3"/><text class="ntext" x="810" y="69">NextStep</text></g>
      <g class="n-skip"><rect x="740" y="140" width="140" height="50" rx="3"/><text class="ntext" x="810" y="169">JobFailed</text></g>
      <text x="20" y="212" class="cap">the empty fallback lanes are the point — no polling ever ran · typically 1–3 min end to end</text>
    </g>
  </g>

  <!-- ============ PANEL 2 · SOFT FAILURE ============ -->
  <g transform="translate(0,332)">
    <text x="24" y="16" class="hdr" fill="#AC3128">02 · SOFT FAILURE — job throws</text>
    <text x="330" y="16" class="hdrnote">the except block posts a failure callback carrying the full traceback</text>
    <g transform="translate(0,26)">
      <!-- untaken edges -->
      <path class="edge" d="M430,55 L735,55"/>
      <path class="edge" d="M260,95 L260,138"/>
      <path class="edge" d="M390,165 L433,165"/>
      <path class="edge" d="M610,150 C 665,138 695,105 735,82"/>
      <path class="edge" d="M610,178 L735,178"/>
      <!-- taken path -->
      <path d="M150,65 L193,65" stroke="#1C7A55" stroke-width="2.6" fill="none" marker-end="url(#aOk)"/>
      <path d="M430,88 C 555,102 645,122 731,150" stroke="#AC3128" stroke-width="2.6" fill="none" marker-end="url(#aCrit)"/>
      <text x="278" y="125" class="elabel" fill="#AC3128" font-weight="600">failure callback — traceback as cause</text>
      <!-- nodes -->
      <g class="n-ok"><rect x="20" y="40" width="130" height="50" rx="3"/><text class="ntext" x="85" y="69">PreviousStep</text></g>
      <g class="n-fail"><rect x="200" y="35" width="230" height="60" rx="3"/>
        <text class="ntext" x="315" y="60">SubmitAndAwaitCallback</text>
        <text class="nsub" x="315" y="78">States.TaskFailed · the job said why</text></g>
      <g class="n-skip"><rect x="200" y="140" width="190" height="50" rx="3"/><text class="ntext" x="295" y="169">FindRun</text></g>
      <g class="n-skip"><rect x="435" y="140" width="175" height="50" rx="3"/><text class="ntext" x="522" y="169">PollUntilComplete</text></g>
      <g class="n-skip"><rect x="740" y="40" width="140" height="50" rx="3"/><text class="ntext" x="810" y="69">NextStep</text></g>
      <g class="n-fail"><rect x="740" y="140" width="140" height="50" rx="3"/><text class="ntext" x="810" y="169">JobFailed</text></g>
      <text x="20" y="212" class="cap">fails within seconds of the throw · ErrorPath/CausePath surface the job's real traceback in the execution output</text>
    </g>
  </g>

  <!-- ============ PANEL 3 · HARD DEATH (OOM SIM) ============ -->
  <g transform="translate(0,592)">
    <text x="24" y="16" class="hdr" fill="#A96A12">03 · HARD DEATH (OOM SIM) — no callback, no goodbye</text>
    <text x="490" y="16" class="hdrnote">the fallback recovers the verdict</text>
    <g transform="translate(0,26)">
      <!-- untaken edges -->
      <path class="edge" d="M430,55 L735,55"/>
      <path class="edge" d="M610,150 C 665,138 695,105 735,82"/>
      <text x="20" y="203" class="elabel" fill="#6B7C84">grey curve → NextStep: a slow cold start exits as COMPLETED</text>
      <!-- taken path -->
      <path d="M150,65 L193,65" stroke="#1C7A55" stroke-width="2.6" fill="none" marker-end="url(#aOk)"/>
      <path d="M260,95 L260,134" stroke="#A96A12" stroke-width="2.6" stroke-dasharray="6 4" fill="none" marker-end="url(#aWarn)"/>
      <text x="30" y="122" class="elabel" fill="#AC3128" font-weight="600">♥ heartbeat timeout (240 s)</text>
      <path d="M390,165 L429,165" stroke="#A96A12" stroke-width="2.6" fill="none" marker-end="url(#aWarn)"/>
      <path d="M610,178 L731,178" stroke="#AC3128" stroke-width="2.6" fill="none" marker-end="url(#aCrit)"/>
      <text x="614" y="200" class="elabel" fill="#AC3128" font-weight="600">poller verdict: FAILED</text>
      <!-- nodes -->
      <g class="n-ok"><rect x="20" y="40" width="130" height="50" rx="3"/><text class="ntext" x="85" y="69">PreviousStep</text></g>
      <g class="n-timeout"><rect x="200" y="35" width="230" height="60" rx="3"/>
        <text class="ntext" x="315" y="60">SubmitAndAwaitCallback</text>
        <text class="nsub" x="315" y="78">States.Timeout · heartbeats stopped</text></g>
      <g class="n-warn"><rect x="200" y="140" width="190" height="50" rx="3"/>
        <text class="ntext" x="295" y="163">FindRun</text>
        <text class="nsub" x="295" y="178">list_runs by job name</text></g>
      <g class="n-warn"><rect x="435" y="140" width="175" height="50" rx="3"/>
        <text class="ntext" x="522" y="163">PollUntilComplete</text>
        <text class="nsub" x="522" y="178">reusable poller SM</text></g>
      <g class="n-skip"><rect x="740" y="40" width="140" height="50" rx="3"/><text class="ntext" x="810" y="69">NextStep</text></g>
      <g class="n-fail"><rect x="740" y="140" width="140" height="50" rx="3"/><text class="ntext" x="810" y="169">JobFailed</text></g>
      <text x="20" y="217" class="cap">os._exit(137) mid-run — no except, no finally · verified live: FAILED verdict in 4m46s end to end</text>
    </g>
  </g>

  <!-- footer legend -->
  <g transform="translate(24,866)" font-size="10" fill="#6B7C84">
    <rect x="0" y="-8" width="14" height="3" fill="#1C7A55"/><text x="20" y="-3">callback path</text>
    <rect x="130" y="-8" width="14" height="3" fill="#A96A12"/><text x="150" y="-3">fallback path</text>
    <rect x="262" y="-8" width="14" height="3" fill="#AC3128"/><text x="282" y="-3">failure surfaced</text>
    <text x="420" y="-3">greyed dashed nodes = states that never ran in that mode</text>
  </g>
</svg>
